name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore .\Comet.sln
      - name: Build
        run: dotnet build .\Comet.sln -c Release --no-restore
      - name: Smoke tests
        run: dotnet run --project .\tests\Comet.SmokeTests\Comet.SmokeTests.csproj -c Release --no-build
      - name: Verify performance summary script
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP "comet-performance-sample.log"
          $tab = [char]9
          @(
            "2026-09-19T00:00:00+00:00${tab}open.first-render${tab}35.2 ms${tab}172 pages",
            "2026-09-19T00:00:01+00:00${tab}page.decode${tab}10.7 ms${tab}page=1",
            "2026-09-19T00:00:02+00:00${tab}cache.hit${tab}- ms${tab}page=2",
            "2026-09-19T00:00:03+00:00${tab}cache.miss${tab}- ms${tab}page=3"
          ) | Set-Content -Path $sample
          .\scripts\summarize-performance.ps1 -Path $sample
      - name: Publish Windows x64
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1 -Version 1.0.0-rc1
      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: Comet-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package v1.0.0 RC1 build
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version 1.0.0-rc1 -BuildInstaller
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: Comet-v1.0.0-rc1
          path: artifacts/release/*
          if-no-files-found: error
