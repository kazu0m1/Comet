name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore .\Comet.sln
      - name: Build
        run: dotnet build .\Comet.sln -c Release --no-restore
      - name: Smoke tests
        run: dotnet run --project .\tests\Comet.SmokeTests\Comet.SmokeTests.csproj -c Release --no-build
      - name: Publish Windows x64
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1 -Version 0.1.0
      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: Comet-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
